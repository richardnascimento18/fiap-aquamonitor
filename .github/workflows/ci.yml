name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore AquaMonitor.sln --locked-mode
      - name: Compile and analyze
        run: dotnet build AquaMonitor.sln --configuration Release --no-restore --warnaserror
      - name: Audit direct and transitive dependencies
        run: |
          mkdir -p TestResults
          dotnet list AquaMonitor.sln package --vulnerable --include-transitive --no-restore --format json > TestResults/dependency-audit.json
          python3 scripts/ci/verify-dependency-audit.py TestResults/dependency-audit.json
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: TestResults/dependency-audit.json
          if-no-files-found: error
          retention-days: 60
      - name: Verify formatting and analyzer fixes
        run: dotnet format AquaMonitor.sln --verify-no-changes --no-restore --severity warn

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore AquaMonitor.sln --locked-mode
      - run: dotnet build AquaMonitor.sln --configuration Release --no-restore --warnaserror
      - name: Regressions, API contracts, endpoint coverage, and Portuguese BDD
        run: python3 scripts/verify-tests.py --no-build
      - name: Upload test and behavioral evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error
          retention-days: 60

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag aquamonitor:ci .
      - name: Verify startup, security defaults, and persistent storage
        run: python3 scripts/ci/docker-smoke.py --image aquamonitor:ci
